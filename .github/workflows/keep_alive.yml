name: Keep Alive — Supabase DB Ping

on:
  schedule:
    # Runs every 2 days at 08:00 UTC
    # Supabase free tier pauses after 7 days of inactivity.
    # Pinging every 2 days gives a 5-day safety buffer — meaning
    # 3 consecutive failures would need to occur before a pause.
    - cron: "0 8 */2 * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Supabase Directly
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $SUPABASE_URL ..."

          RESPONSE=$(curl --silent --write-out "\nHTTP_STATUS:%{http_code}" \
            --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Supabase ping failed — DB may be paused or unreachable."
            exit 1
          fi

          echo "Supabase is alive."